<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>Zaki Services | Find it. Source it. Get it.</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050607;color:#fff;font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit}.stage{position:relative;width:100%;min-height:100svh;background:#050607;overflow:hidden}.desktop{display:block;width:100%;height:auto}.base{display:block;width:100%;height:auto}.hero-window{position:absolute;z-index:4;left:0;right:0;top:6.6%;height:58.5%;overflow:hidden;pointer-events:none;background:#08090b}.hero-window img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;opacity:0;transition:opacity .18s ease}.hero-window img.show{opacity:1}.card-hotspot{position:absolute;z-index:10;top:72.1%;height:17.8%;cursor:pointer;border:1px solid transparent;border-radius:9px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;background:transparent}.card-hotspot:hover,.card-hotspot.active{border-color:rgba(255,107,0,.95);box-shadow:0 0 24px rgba(255,107,0,.25),inset 0 0 16px rgba(255,107,0,.05);transform:translateY(-2px)}.hot-g{left:10.1%;width:25.5%}.hot-p{left:38.1%;width:25.7%}.hot-a{left:66.1%;width:25.8%}.clean-left,.clean-right{position:absolute;z-index:8;top:45%;width:3.3%;height:9%;background:#08090b;pointer-events:none}.clean-left{left:0}.clean-right{right:0}.clean-label{position:absolute;z-index:8;left:0;bottom:14.1%;width:27%;height:3.5%;background:#08090b;pointer-events:none}.pointer-glow{position:fixed;z-index:30;width:18px;height:18px;border:1px solid rgba(255,107,0,.85);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 14px rgba(255,107,0,.6),0 0 34px rgba(255,107,0,.15);opacity:0}.mobile{display:none}
@media(max-width:700px){
 body{overflow-x:hidden}.desktop{display:none}.mobile{display:block}.mobile-shell{min-height:100svh;padding-bottom:18px;background:#050607}.m-header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.12);background:rgba(5,6,7,.96);position:sticky;top:0;z-index:20}.logo{font-weight:900;letter-spacing:2px;font-size:20px;line-height:16px}.logo span{display:block;color:#ff6b00;font-size:8px;letter-spacing:3px;margin-top:3px}.menu{width:42px;height:38px;border:1px solid #333;border-radius:7px;background:#0c0e10;display:grid;place-items:center;font-size:22px}.m-copy{padding:20px 18px 10px}.eyebrow{font-size:10px;letter-spacing:2px;color:#ff6b00;font-weight:700}.m-copy h1{font-size:30px;line-height:1.02;margin:7px 0 5px}.m-copy h1 span{color:#ff6b00}.m-copy p{font-size:12px;line-height:1.45;color:#b9b9b9;margin:0;max-width:330px}.m-search{margin-top:14px;display:flex;height:44px}.m-search input{min-width:0;flex:1;background:#0c0e10;border:1px solid #333;color:#fff;padding:0 12px;border-radius:7px 0 0 7px;font-size:11px}.m-search button{width:48px;border:0;border-radius:0 7px 7px 0;background:#ff6b00;font-weight:800}.m-request{width:100%;height:40px;margin-top:9px;border:1px solid #ff6b00;border-radius:7px;background:transparent;font-weight:700;font-size:11px}.m-hero{margin:6px 10px 0;border-radius:10px;overflow:hidden;background:#08090b;aspect-ratio:1.5/1;position:relative}.m-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .18s ease}.m-hero img.show{opacity:1}.m-hero .gmobile{opacity:1}.m-dots{display:flex;gap:6px;justify-content:center;margin:8px 0}.m-dots i{width:22px;height:3px;background:#666;border-radius:2px}.m-dots i.active{background:#ff6b00}.m-cars{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 10px}.m-card{border:1px solid #292d31;border-radius:8px;background:#0a0c0e;padding:5px;cursor:pointer;transition:.18s ease}.m-card.active,.m-card:hover{border-color:#ff6b00;box-shadow:0 0 16px rgba(255,107,0,.18)}.m-card img{width:100%;aspect-ratio:1.35/1;object-fit:cover;border-radius:5px;display:block}.m-card strong{display:block;font-size:9px;margin:6px 3px 2px}.m-card span{display:block;color:#ff6b00;font-size:8px;margin:0 3px 5px}.m-trust{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:13px 10px 0;padding-top:10px;border-top:1px solid #222}.m-trust div{font-size:8px;color:#999;text-align:center;line-height:1.25}.m-trust b{display:block;color:#fff;font-size:9px;margin-bottom:2px}.pointer-glow{display:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="desktop">
    <img class="base" src="base.webp" alt="Zaki Services automotive parts landing page">
    <div class="hero-window" aria-live="polite">
      <img id="porsche" src="porsche.webp" loading="lazy" alt="Porsche Cayenne technical parts breakdown">
      <img id="audi" src="audi.webp" loading="lazy" alt="Audi Q8 technical parts breakdown">
    </div>
    <div class="clean-left"></div><div class="clean-right"></div><div class="clean-label"></div>
    <button class="card-hotspot hot-g active" data-car="g" aria-label="Mercedes-Benz G-Class"></button>
    <button class="card-hotspot hot-p" data-car="p" aria-label="Porsche Cayenne"></button>
    <button class="card-hotspot hot-a" data-car="a" aria-label="Audi Q8"></button>
  </div>

  <div class="mobile mobile-shell">
    <header class="m-header"><div class="logo">ZAKI<span>SERVICES</span></div><button class="menu" aria-label="Menu">☰</button></header>
    <section class="m-copy"><div class="eyebrow">PREMIUM AUTOMOTIVE SOURCING</div><h1>HARD-TO-FIND<br><span>PARTS. WE FIND IT.</span></h1><p>Genuine, OEM and aftermarket parts for premium vehicles.</p><div class="m-search"><input aria-label="Search" placeholder="Search by part name or OEM number..."><button aria-label="Search">⌕</button></div><button class="m-request">REQUEST A PART ›</button></section>
    <div class="m-hero"><img class="gmobile" src="gclass.webp" alt="Mercedes-Benz G-Class technical parts breakdown"><img id="mporsche" src="porsche.webp" loading="lazy" alt="Porsche Cayenne technical parts breakdown"><img id="maudi" src="audi.webp" loading="lazy" alt="Audi Q8 technical parts breakdown"></div>
    <div class="m-dots"><i class="active" data-dot="g"></i><i data-dot="p"></i><i data-dot="a"></i></div>
    <div class="m-cars">
      <button class="m-card active" data-car="g"><img src="gclass.webp" alt="Mercedes-Benz G-Class"><strong>MERCEDES-BENZ</strong><span>G-CLASS</span></button>
      <button class="m-card" data-car="p"><img src="porsche.webp" loading="lazy" alt="Porsche Cayenne"><strong>PORSCHE</strong><span>CAYENNE</span></button>
      <button class="m-card" data-car="a"><img src="audi.webp" loading="lazy" alt="Audi Q8"><strong>AUDI</strong><span>Q8</span></button>
    </div>
    <div class="m-trust"><div><b>GENUINE & OEM</b>Authentic parts</div><div><b>WORLDWIDE SOURCING</b>We find what others can't</div><div><b>FAST DELIVERY</b>Safe & reliable shipping</div></div>
  </div>
  <div class="pointer-glow" id="glow"></div>
</div>
<script>
const porsche=document.getElementById('porsche'),audi=document.getElementById('audi'),cards=[...document.querySelectorAll('.desktop .card-hotspot')],mp=document.getElementById('mporsche'),ma=document.getElementById('maudi'),mCards=[...document.querySelectorAll('.m-card')],dots=[...document.querySelectorAll('.m-dots i')],glow=document.getElementById('glow');
function selectCar(car){
 cards.forEach(c=>c.classList.toggle('active',c.dataset.car===car));
 mCards.forEach(c=>c.classList.toggle('active',c.dataset.car===car));
 dots.forEach(d=>d.classList.toggle('active',d.dataset.dot===car));
 if(porsche){porsche.classList.toggle('show',car==='p');audi.classList.toggle('show',car==='a')}
 if(mp){mp.classList.toggle('show',car==='p');ma.classList.toggle('show',car==='a')}
}
[...cards,...mCards].forEach(c=>c.addEventListener('click',()=>selectCar(c.dataset.car)));
dots.forEach(d=>d.addEventListener('click',()=>selectCar(d.dataset.dot)));
document.addEventListener('mousemove',e=>{if(glow){glow.style.left=e.clientX+'px';glow.style.top=e.clientY+'px';glow.style.opacity='1'}});
</script>
</body>
</html>
