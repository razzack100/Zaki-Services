<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zaki Services</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050607;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
html{background:#050607}
.stage{position:relative;width:100%;height:100dvh;min-height:100%;background:#08090b;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .65s ease;pointer-events:none}
.slide.active{opacity:1}
.slide img{display:block;width:100%;height:100%;object-fit:contain;object-position:center center;background:#08090b}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 58%,rgba(0,0,0,.2));pointer-events:none}
.nav{position:absolute;z-index:10;top:0;left:0;right:0;height:72px;display:flex;align-items:center;padding:0 3.1%;background:rgba(0,0,0,.74);border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-size:27px;font-weight:800;letter-spacing:3px;line-height:.82}
.logo small{display:block;color:#ff6b00;font-size:10px;letter-spacing:4px;margin-top:7px}
.navlinks{margin-left:auto;display:flex;gap:31px;font-size:12px;letter-spacing:.3px;color:#e8e8e8}
.navlinks span{white-space:nowrap}
.arrow{position:absolute;z-index:12;top:51%;transform:translateY(-50%);width:48px;height:68px;display:grid;place-items:center;border:1px solid rgba(255,107,0,.28);background:rgba(0,0,0,.36);font-size:38px;color:#eee;cursor:pointer;user-select:none;transition:.2s}
.arrow:hover{color:#ff6b00;box-shadow:0 0 22px rgba(255,107,0,.42),inset 0 0 18px rgba(255,107,0,.06)}
.prev{left:18px} .next{right:18px}
.meta{position:absolute;z-index:11;left:3.3%;bottom:7.5%;font-size:13px;letter-spacing:2.5px;color:#ff6b00;text-shadow:0 2px 12px #000}
.dots{position:absolute;z-index:11;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:9px}
.dot{width:40px;height:3px;background:#777;border-radius:8px;transition:.2s}
.dot.active{background:#ff6b00;box-shadow:0 0 12px rgba(255,107,0,.7)}
.pointer-glow{position:fixed;z-index:50;width:20px;height:20px;border:1px solid rgba(255,107,0,.85);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 16px rgba(255,107,0,.65),0 0 42px rgba(255,107,0,.18);opacity:0}
@media(max-width:850px){
 .nav{height:52px;padding:0 16px;background:rgba(0,0,0,.58)}
 .navlinks{display:none}
 .logo{font-size:19px;letter-spacing:2.5px}
 .logo small{font-size:7px;letter-spacing:3px;margin-top:5px}
 .arrow{width:38px;height:54px;top:52%;font-size:29px;background:rgba(0,0,0,.32)}
 .prev{left:7px}.next{right:7px}
 .meta{display:none}
 .dots{bottom:13px;gap:6px}
 .dot{width:28px;height:2px}
 .pointer-glow{display:none}
}
@media(max-width:480px){
 .slide img{object-fit:contain}
 .arrow{width:34px;height:48px}
}
</style>
</head>

<script>
const slides=[...document.querySelectorAll('.slide')];
const dots=[...document.querySelectorAll('.dot')];
const names=['MERCEDES-BENZ • G-CLASS','PORSCHE • CAYENNE','AUDI • Q8'];
let current=0, timer;
function show(n){
 current=(n+slides.length)%slides.length;
 slides.forEach((s,i)=>s.classList.toggle('active',i===current));
 dots.forEach((d,i)=>d.classList.toggle('active',i===current));
 document.getElementById('meta').textContent=names[current];
}
function restart(){
 clearInterval(timer);
 timer=setInterval(()=>show(current+1),12000);
}
document.querySelector('.prev').onclick=()=>{show(current-1);restart()};
document.querySelector('.next').onclick=()=>{show(current+1);restart()};
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'){show(current-1);restart()}
 if(e.key==='ArrowRight'){show(current+1);restart()}
});
restart();

const glow=document.getElementById('glow');
document.addEventListener('mousemove',e=>{
 glow.style.left=e.clientX+'px'; glow.style.top=e.clientY+'px'; glow.style.opacity='1';
});
document.addEventListener('mouseleave',()=>glow.style.opacity='0');
</script>
